name: Move hooks tests

on:
  push:
    branches:
      - audit/async-callback-uint64-precision
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  move-hooks:
    name: go test ./x/ibc-hooks/move-hooks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Run move-hooks tests
        run: go test ./x/ibc-hooks/move-hooks -count=1
